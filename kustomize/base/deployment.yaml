---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mysql-volsync
  name: mysql-volsync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-volsync
  template:
    metadata:
      labels:
        app: mysql-volsync
    spec:
      containers:
        - name: mysql
          image: registry.redhat.io/rhel9/mysql-80:latest
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
                  mysqladmin ping -u root
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
                  mysqladmin ping -u root
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pv-claim
