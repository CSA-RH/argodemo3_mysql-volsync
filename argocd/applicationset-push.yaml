---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mysql-volsync
  namespace: openshift-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: mysql-volsync-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: mysql-volsync-{{name}}
    spec:
      project: default
      source:
        repoURL: https://github.com/CSA-RH/argodemo3_mysql-volsync.git
        targetRevision: main
        path: kustomize/overlays/prod
      destination:
        server: "{{server}}"
        namespace: mysql-volsync
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
